        <div class="header-default_buttons">
          <button id="moon">Moon</button>
          <button id="nature">Nature</button>
          <button id="warm">Warm</button>
          <button id="ice">Ice</button>
        </div>
      </div>
    </header>
    <section class="search-section">
      <h2>Search a Color</h2>
      <div class="search-controls">
        <input
          id="color-search"
          class="search-input"
          type="text"
          placeholder="Enter or paste a HEX color"
          aria-label="Search for a HEX color"
          autocomplete="off"
          spellcheck="false"
        />
        <div
          id="search-result"
          class="search-result"
          aria-live="polite"
          hidden
        ></div>
      </div>
    </section>
